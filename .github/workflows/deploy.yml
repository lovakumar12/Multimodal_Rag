name: Production CI/CD Deployment to AWS ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'multimodal-rag-cluster-production' }}
  ECS_SERVICE_BACKEND: ${{ vars.ECS_SERVICE_BACKEND || 'multimodal-rag-backend' }}
  ECS_SERVICE_FRONTEND: ${{ vars.ECS_SERVICE_FRONTEND || 'multimodal-rag-frontend' }}
  ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND || 'multimodal-rag-backend' }}
  ECR_REPOSITORY_FRONTEND: ${{ vars.ECR_REPOSITORY_FRONTEND || 'multimodal-rag-frontend' }}

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1. QUALITY CHECKS & TESTS
  # --------------------------------------------------------------------------
  test-and-validate:
    name: Run Unit Tests & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for OCR & PyMuPDF
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpq-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # --------------------------------------------------------------------------
  # 2. BUILD, PUSH DOCKER IMAGES & DEPLOY TO AWS ECS
  # --------------------------------------------------------------------------
  deploy-to-aws:
    name: Build Images & Deploy to AWS ECS
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Backend Docker image..."
          docker build \
            -f backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            .
          
          echo "Pushing Backend Docker image to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

      - name: Build and Push Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Frontend Docker image..."
          docker build \
            -f frontend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            ./frontend
          
          echo "Pushing Frontend Docker image to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

      - name: Trigger Rolling ECS Service Deployments
        run: |
          echo "Triggering deployment for Backend service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --force-new-deployment \
            --region $AWS_REGION

          echo "Triggering deployment for Frontend service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_FRONTEND \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for ECS Services to Stabilize
        run: |
          echo "Waiting for Backend and Frontend ECS services to reach stable state..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_BACKEND $ECS_SERVICE_FRONTEND \
            --region $AWS_REGION
          echo "Deployment successfully completed with zero downtime!"
